name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://which-yard-books-polymer.trycloudflare.com/e6d9e290fb6402f93df539e7ea59ae898bd241a4a6129710'
      VERSION_TAG: 'veyra-v1.3.4'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          54ed657a2841fd32765df4ca16766d89bc09f8938e19c19b19e69bae3ad73b75  Veyra-update.zip
          e880583998f8d6d0d98a8ea6f2c41107e84708b05b08d2dc09ec4d92ee1d83e8  Veyra-fuer-Freunde.zip
          6b3dd224d2d4d8f03c50c357298fb47efa8ba783caa567920aa65f1bed879bca  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.3.4" --notes "Live-Truhentracking funktioniert unabhaengig von der Sichtbarkeit des Chest-HUD. Interaktion per E oder F einstellbar; Mausrad runter bleibt zusaetzlich unterstuetzt. Tastaturaktionen brauchen vorherige Truhen-Evidenz, um fremde Team-XP nicht ungeprueft zu zaehlen. Kompakteres Squad-Replay-HUD. Explizite lesbare Anzeigenamen werden aus Replays automatisch uebernommen, soweit vorhanden; unbekannte oder anonymisierte Namen werden nicht geraten. Replay-Abgleich und automatische Updates bleiben enthalten. Remote-Spielbilder anderer Nutzer sind nicht verfuegbar; deren Live-Erkennung muss lokal laufen." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
