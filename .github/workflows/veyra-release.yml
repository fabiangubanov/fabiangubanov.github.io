name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://gotta-planet-zoo-stake.trycloudflare.com/ea675d2e9138e6aef3014e7cc33c12a2dd0cc7a4c27b4daf'
      VERSION_TAG: 'veyra-v1.3.5'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          7b1c4c12e248451a830e185e13719cd2941ff82442b995f589fea4ddfade6d9b  Veyra-update.zip
          da568a403e139e80985aa59d1739c05812530c8652b124fffe59d5c39e0988c0  Veyra-fuer-Freunde.zip
          cec37b65020048946f10f479c364c00c1edf72d7bcad21125ca3a6212da54d3b  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.3.5" --notes "Replay-Nachtraege werden jetzt als kurze Meldung im gewaehlten Veyra-Design angezeigt: +7 Truhen nachgetragen / Durch Replay bestaetigt. Der Hinweis erscheint ausschliesslich fuer erfolgreich gespeicherte Ergaenzungen des laufenden Replay-Abgleichs, fasst mehrere Nachtraege zusammen und bleibt fuenf sichtbare Sekunden stehen. Bei verborgenem HUD wartet die Meldung auf die naechste Anzeige. Bereits erfasste Replays und Live-Zaehlungen loesen keinen Replay-Hinweis aus. Position ist im HUD-Editor verschiebbar." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
