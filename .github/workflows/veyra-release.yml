name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://veyra-downloads.chickensmp.workers.dev/v1.3.13'
      VERSION_TAG: 'veyra-v1.3.13'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          77fbfb072349c24de1f3ab2f186c061069062b99a20636bc7ebbda9896ef9181  Veyra-update.zip
          ad21c86844da9f7586444812c509b52490808dd7e4165647b8ed2d0f7f184ff2  Veyra-fuer-Freunde.zip
          84deb037ec2281e3d224d2306581f3573d93fd5d9ecfc664d847dd7eedc2fed5  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.3.13" --notes "Team-HUD zeigt klar die letzte abgeschlossene Runde: Spielernamen mit erfassten Oeffnungen dieser Runde, darunter Runde gesamt ohne den eigenen Spieler. Der gespeicherte Overall-Zaehler aller archivierten Team-Runden bleibt getrennt sichtbar. Mehrere Replay-PlayerStates desselben Namens werden in der Rundenanzeige zusammengefasst. Die automatische eigene Namenserkennung gleicht typische OCR-Verwechslungen wie pvqo/pvq0 mit dem bestaetigten eigenen Replay-Namen ab; unterschiedliche andere Namen werden dadurch nicht zusammengelegt. Replay-Zahlen bleiben Mindestzahlen, weil entfernte Oeffnungen im eigenen Replay fehlen koennen. Aktualisierung der Rundenwerte nach Abschluss und Auswertung des Replays." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
