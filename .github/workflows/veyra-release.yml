name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://veyra-downloads.chickensmp.workers.dev/v1.3.11'
      VERSION_TAG: 'veyra-v1.3.11'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          b74bd600c27057255d8b2416bb187a73af26ba4dce3d2518a56f5599b9f6102e  Veyra-update.zip
          bfb8c34499ef86b8f130cd165a929028288fb35ef7cbc05a56730bc55db6e8dd  Veyra-fuer-Freunde.zip
          673ea499f4307b935708cb9d3171e0bcbd25e17530713910e1ecdb8b13c08ee2  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.3.11" --notes "Verbesserte Tastatur-Truhenerkennung: Such-Hinweis wird separat gelesen, ein kurzer vorgemerkter Tastendruck kann mit einer nachfolgenden Truhenbestaetigung verbunden werden; abgelaufene Eingaben und fremde XP ohne eigene Evidenz bleiben ausgeschlossen. Tastatur-Autowiederholungen erzeugen keine neuen Interaktionen. Bei aktiviertem Teilen zeigt die Spielerliste jetzt App-Version, Tracking-Zustand, Interaktionstaste und Zeit der letzten Live-Zaehlung; keine Spielbilder oder OCR-Texte werden dafuer uebertragen. Cloudflare Community/D1 unterstuetzt diese signierten Metadaten und entfernt sie beim Zuruecknehmen der Freigabe. Oeffentliche Update-Dateien sind nun auch direkt auf Cloudflare verfuegbar. Live-Ursache auf fremden PCs muss nach deren Aktualisierung weiterhin geprueft werden." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
