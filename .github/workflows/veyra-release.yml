name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://commitment-imperial-concerts-fellow.trycloudflare.com/0139365e8b91db346b311f3ffaba0d929737c7ed35e4917e'
      VERSION_TAG: 'veyra-v1.3.7'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          0f15bfc0be3841595c0ada064888fbc703db973d487a8f063f0e373ffc41d422  Veyra-update.zip
          d9c85bec4158d5c3615a9fdf9fd48b5dadb12f4713bcb8a230d01a7a364f271f  Veyra-fuer-Freunde.zip
          da063eda52cecc0c23a2ec967cdb5af55eccdc5f513057be873ae71c52d380ed  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.3.7" --notes "Gespeicherter Mitspieler-Gesamtzaehler fuer Duo, Trio und Squad: addiert die im eigenen Replay erfassten Truhen anderer Teammitglieder ueber abgeschlossene Runden. Eigene Truhen sind ausgeschlossen, auch beim Laden zuvor gespeicherter Staende. Jede Replay-ID zaehlt nur einmal; Neustarts und erneutes Scannen zaehlen nicht doppelt. Verbesserte Auswertungen ergaenzen nur die Differenz. Vorhandene aeltere Replays werden im Hintergrund nachgelesen. Anzeige als Mindestzahl mit Anzahl der erfassten Team-Runden; entfernte Oeffnungen koennen im Replay fehlen. Der persoenliche Zaehler bleibt unabhaengig." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
