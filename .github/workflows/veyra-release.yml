name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://minds-handbook-constantly-enzyme.trycloudflare.com/fb15085d7c4504f2b588875271336ee45b486f7b287e9e8e'
      VERSION_TAG: 'veyra-v1.3.10'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          ec08629ab8932d2c89df791b4a9c23f6c2d4e14d1b5cae58096e36d206a686be  Veyra-update.zip
          a05247ff0a08a8edd08547969ccf22f2e7ace9a825f5a60b710a9ec76c3cfc32  Veyra-fuer-Freunde.zip
          2afc7a4ef06b07c9c14e19f9d4334f1062355aaa02a85f806969c87fa81da8dd  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.3.10" --notes "Bereit-Warnung prueft jetzt den ausgewaehlten Sprite direkt ueber READY: erkannter Fortune/Plundarrgh laesst das Bereitmachen ohne Warnung zu; bei fehlendem oder unklarem Sprite bleibt die Warnung. Automatische Namen im Team-Replay-HUD werden aus dem separaten Namensdatenblock gelesen und ueber die PlayerState-ID zugeordnet. Bereits archivierte Runden werden dafuer nachgelesen. Neuer vollstaendiger Replay-Mindeststand-Abgleich seit Saisonstart: vorhandene eigene Replay-Oeffnungen koennen einen zu niedrigen Gesamtzaehler anheben, hoehere gespeicherte Staende bleiben erhalten. Atomare Replay-Markierungen verhindern doppelte Nachtraege nach Neustarts. Fuer geloeschte/nicht aufgezeichnete Replays lassen sich keine fehlenden Zahlen bestimmen. Auto-Update installiert nach Schliessen von Fortnite." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
