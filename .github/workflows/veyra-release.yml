name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://promised-like-liability-turned.trycloudflare.com/56c83d4da240aa9d09bb40d6886750446b9e57e7e35fd29c'
      VERSION_TAG: 'veyra-v1.1.1'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          cfda82e8d8cc5e0e2d7719905425b9b50ab87b52b90339c9a59420f2f34a628c  Veyra-update.zip
          71e522126851941367c4d22b4f1c71ad1953a362edc3b9a77a03197657f37498  Veyra-fuer-Freunde.zip
          f98e66bce0aeb7e877b6c4a7ad8b5383f0e235a2727d2faf71c23f9659ee4c1c  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.1.1" --notes "Updatefenster ohne sichtbare Updateadresse. Menü, Verlauf und Fortune-Warnung übernehmen jetzt den gewählten Veyra-Stil einschließlich Liquid Glass, Frost, Weihnachten und Schnee. Einstellungen und Truhenstände bleiben erhalten." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
