name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://though-coordinate-glasses-nevada.trycloudflare.com/905a0751add3cb625013a216c57595f5913cbac2705cd58a'
      VERSION_TAG: 'veyra-v1.3.0'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          326bc56127554c451661a16eaee087d130ffa4ed7722b087c427aaf9853b6857  Veyra-update.zip
          d7c2e642e66b80282213109e6808e9109b266150c9c3756cc60ec54831dcd832  Veyra-fuer-Freunde.zip
          baca56fb1f0a743d92bcc1556965bb280ff902f2165a6250658395e045099357  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.3.0" --notes "Replay-Abgleich bearbeitet jetzt auch aeltere ungepruefte Runden statt nur die zehn neuesten Dateien. Fehlende eigene Truhen werden ohne Doppelzaehlung nachgetragen. Auswaehlbare Spielerstaende im HUD, automatische Namenserkennung in der Fortnite-Lobby und dauerhafte Cloudflare-Spielerliste. Bestehende Zaehler bleiben erhalten." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
