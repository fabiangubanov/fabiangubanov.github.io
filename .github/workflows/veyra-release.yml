name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://believes-incomplete-significantly-cho.trycloudflare.com/952fae56fd8e74a673d27f014de3b7d28d190a369275d87e'
      VERSION_TAG: 'veyra-v1.2.0'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          43a77102a4a566376f0db6a647cf45f9558d37ae2fa6279f1df82922e07c667c  Veyra-update.zip
          230b02a45e17dc47019d48e91c26e613e974bba56747a23d48941fdae9181b97  Veyra-fuer-Freunde.zip
          472d45d29e1366601256232f59a020ac397565d836cccade4c5a54027345e858  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.2.0" --notes "Veyra-Profil ohne E-Mail und Passwort: Fortnite-Anzeigenamen eintragen und eigenen Truhenstand freiwillig mit anderen Veyra-Nutzern teilen. Die gemeinsame Spielerliste läuft derzeit auf dem PC des Betreibers und ist nur erreichbar, solange dieser Server läuft. Neue unbenutzte Zähler übernehmen einmalig eigene Truhen aus vorhandenen abgeschlossenen Replays ab 1. November 2026. Bestehende Zähler bleiben erhalten. P wird außerhalb von Fortnite nicht mehr abgefangen." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
