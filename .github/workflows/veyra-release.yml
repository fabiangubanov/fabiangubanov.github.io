name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://mathematics-speech-decent-pda.trycloudflare.com/51fba24afbd2e472a891f961cb0dea317ff53049b542c3b9'
      VERSION_TAG: 'veyra-v1.2.1'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          ad1f8a60f22ee97d343b4cd71f305bab1a00db210a8c404b8738195c88b1e158  Veyra-update.zip
          73315d5d6544416db0a2cb25a66e71659ad549345e0b9e7f62d20242139b1676  Veyra-fuer-Freunde.zip
          9b9e09ffe4206aab6b9e1599b77f7b6170e1d7a226daa80cd08eed154e86cdf5  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.2.1" --notes "Veyra-Profil ohne E-Mail und Passwort: Fortnite-Anzeigenamen eintragen und eigenen Truhenstand freiwillig mit anderen Veyra-Nutzern teilen. Die gemeinsame Spielerliste läuft derzeit auf dem PC des Betreibers und ist nur erreichbar, solange dieser Server läuft. Neue unbenutzte Zähler übernehmen einmalig eigene Truhen aus vorhandenen abgeschlossenen Replays ab 1. November 2026. Bestehende Zähler bleiben erhalten. P wird außerhalb von Fortnite nicht mehr abgefangen." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
