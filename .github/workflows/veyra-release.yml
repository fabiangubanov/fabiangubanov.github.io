name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://collins-efficient-periods-balanced.trycloudflare.com/5b5510436d93e22d50027b332099ca59abdc090feb894a70'
      VERSION_TAG: 'veyra-v1.3.2'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          35c250c2046fab872afea295302a233fe0c2f97ee649594f68d237dbef0f132d  Veyra-update.zip
          7d16b8d4b02231a09534264c0df7dd18087367a89d6e7ba68e2b0b77c630c00f  Veyra-fuer-Freunde.zip
          d4c7b664e9b2ebd987523f367d96b715ab9fa8509af2b0ab2531a6ffa016a39b  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.3.2" --notes "Fill-Squad-HUD fuer die letzte abgeschlossene Replay-Runde. Zeigt lokal zugeordnete Truhenoeffnungen anderer Teammitglieder als Mindestzahl, mit Replay-Kennungen statt unzuverlaessigen Spielernamen. Keine Live- oder Kontogesamtstaende: entfernte Oeffnungen koennen im eigenen Replay fehlen, -- bedeutet keine zugeordneten Daten. Eigener Gesamtzaehler bleibt unveraendert. Automatische Updates aus 1.3.1 bleiben enthalten und installieren nach dem Schliessen von Fortnite." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
