name: Publish Veyra release
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veyra-release.yml'
permissions:
  contents: write
concurrency:
  group: veyra-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: 'https://passage-admissions-ricky-impressed.trycloudflare.com/72d6b0aea36b9449c21ab5716a7d65792b314cafbeb19659'
      VERSION_TAG: 'veyra-v1.3.1'
    steps:
      - name: Retrieve prepared public release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cd release
          for name in Veyra-update.zip Veyra-fuer-Freunde.zip latest.json; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 "$SOURCE/$name" --output "$name"
          done
          cat > SHA256SUMS <<'HASHES'
          779462f35135081d0463cf6a37480e228c663335dd7d4c5e1616795128d706fe  Veyra-update.zip
          b130833a4faaca6178e3235f90599d669a5cb0817e9b49c8bbf19ed33554a197  Veyra-fuer-Freunde.zip
          8ba8be40bc0a3ddfeb4995128ce9b7fac31ae81ac0ecc5d6804ce9d90a87e50f  latest.json
          HASHES
          sha256sum --check SHA256SUMS
      - name: Publish immutable version and stable signed update feed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "This version already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "Veyra 1.3.1" --notes "Automatische Updates: Veyra prueft im Hintergrund, laedt signierte neue Versionen und installiert sie automatisch mit Neustart, sobald Fortnite geschlossen ist. Bereits laufende Matches werden nicht unterbrochen. Automatische Updates sind standardmaessig aktiv und im Updatefenster abschaltbar. Enthalten sind auch der Replay-Rueckstandsabgleich, Spielerstaende im HUD, Lobby-Namenserkennung und die dauerhafte Cloudflare-Spielerliste. Fuer bisherige Versionen ist einmalig eine manuelle Aktualisierung erforderlich." --draft
          gh release upload "$VERSION_TAG" release/Veyra-update.zip release/Veyra-fuer-Freunde.zip release/latest.json release/SHA256SUMS
          gh release edit "$VERSION_TAG" --draft=false --latest=true
          if ! gh release view veyra-channel >/dev/null 2>&1; then
            gh release create veyra-channel --target "$GITHUB_SHA" --title "Veyra Updatekanal" --notes "Stabile signierte Updatebeschreibung für Veyra. Für die Erstinstallation bitte den aktuellen Veyra-Versionsdownload verwenden." --draft --latest=false
          fi
          gh release upload veyra-channel release/latest.json --clobber
          gh release edit veyra-channel --draft=false --latest=false
